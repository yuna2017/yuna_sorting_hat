name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# GITHUB_TOKEN 需要这些权限才能发布到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 新的部署顶掉排队中的旧部署，但不打断正在跑的那次
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 与部署地址无关的质量闸门，测试环境保持 posterOrigin=null。
      - run: npm run verify:quality

      # 正式域名使用根路径；只在构建阶段注入海报二维码地址。
      - run: npm run build
        env:
          VITE_BASE: /
          VITE_PUBLIC_PATH: /
          VITE_PUBLIC_ORIGIN: https://ysh.yuna.team

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
